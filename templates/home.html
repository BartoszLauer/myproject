{% load static %}
<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab0 | Bartosz Lauer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Creepster&family=Space+Grotesk:wght@400;600&family=Space+Mono:wght@400;700&display=swap">
  <style>
    /* Te same kolory co w lab01 */
    :root {
      --night: #0e0909;
      --bone: #efe6d6;
      --ink: #0a0606;
      --blood: #b3001b;
      --blood-dark: #6e0010;
      --blood-light: #ff2a3d;
      --muted-dark: #b9a99a;
      --border: 3px solid var(--ink);
      --font: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
      --font-head: "Archivo Black", "Arial Black", Impact, sans-serif;
      --font-horror: "Creepster", "Archivo Black", Impact, cursive;
      --font-mono: "Space Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--night);
      background-image:
        radial-gradient(circle at 15% 20%, rgba(179, 0, 27, .18) 0 120px, transparent 260px),
        radial-gradient(circle at 85% 75%, rgba(110, 0, 16, .25) 0 160px, transparent 340px);
      background-attachment: fixed;
      color: var(--bone);
      font-family: var(--font);
    }

    /* Ziarno VHS - plik z lab01 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      opacity: .08;
      background-image: url("{% static 'lab01/img/noise.svg' %}");
    }

    /* Nagłówek z ociekającą krwią */
    .site-header {
      position: relative;
      background: var(--blood);
      border-bottom: var(--border);
      text-align: center;
      padding: 28px 20px 24px;
    }
    .site-header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      height: 34px;
      background: url("{% static 'lab01/img/drip.svg' %}") repeat-x;
    }
    .site-header h1 {
      margin: 0;
      font-family: var(--font-horror);
      font-weight: 400;
      font-size: 4rem;
      line-height: 1;
      letter-spacing: 2px;
      color: var(--bone);
      text-shadow: 4px 4px 0 var(--ink);
    }
    .site-header p {
      margin: 8px 0 0;
      font-family: var(--font-mono);
      font-size: .9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--ink);
    }

    /* Kafelki labów */
    main {
      flex: 1;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 90px 20px 64px;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 32px;
    }

    .kafel {
      flex: 0 1 260px;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 28px 20px;
      text-align: center;
      text-decoration: none;
      background: var(--bone);
      color: var(--ink);
      border: var(--border);
      box-shadow: 6px 6px 0 var(--blood);
      transition: transform .12s, box-shadow .12s, background .12s;
    }
    .kafel:nth-child(odd) { transform: rotate(-1deg); }
    .kafel:nth-child(even) { transform: rotate(1deg); }
    .kafel:hover {
      transform: translate(-4px, -4px) rotate(0);
      box-shadow: 10px 10px 0 var(--blood);
    }
    .kafel:active { transform: translate(6px, 6px); box-shadow: 0 0 0 var(--blood); }

    .kafel h2 {
      margin: 0;
      font-family: var(--font-horror);
      font-weight: 400;
      font-size: 2.6rem;
      line-height: 1;
      letter-spacing: 1px;
      color: var(--blood);
      text-shadow: 2px 2px 0 var(--ink);
    }
    .kafel p {
      margin: 0;
      font-family: var(--font-head);
      font-size: 1.05rem;
      text-transform: uppercase;
    }
    .kafel:hover h2 { color: var(--blood-light); }

    /* Stopka */
    footer {
      background: var(--ink);
      border-top: 4px solid var(--blood);
      color: var(--muted-dark);
      font-family: var(--font-mono);
      font-size: .85rem;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .site-header h1 { font-size: 3rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1>Lab0</h1>
    <p>Programowanie internetowe · Django</p>
  </header>

  <main>
    <div class="grid">
      {% for lab in laby %}
        <a class="kafel" href="{{ lab.url }}">
          <h2>{{ lab.nazwa }}</h2>
          <p>{{ lab.opis }}</p>
        </a>
      {% endfor %}
    </div>
  </main>

  <footer>&copy; {% now "Y" %} Bartosz Lauer</footer>
</body>
</html>
