<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab0 - Bartosz Lauer</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; padding: 40px 16px; color: #222; }
    h1 { text-align: center; margin: 0 0 8px; }
    .podtytul { text-align: center; color: #666; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1000px; margin: 32px auto; }
    .kafel { background: #fff; border-radius: 12px; padding: 24px; text-decoration: none; color: #222;
             box-shadow: 0 2px 8px rgba(0,0,0,.08); transition: transform .15s, box-shadow .15s; }
    .kafel:hover { transform: translateY(-4px); box-shadow: 0 6px 16px rgba(0,0,0,.15); }
    .kafel h2 { margin: 0 0 8px; color: #0b6e99; }
    .kafel p { margin: 0; color: #555; }
  </style>
</head>
<body>
  <h1>Lab0</h1>
  <p class="podtytul">Moje laby z Django</p>
  <div class="grid">
    {% for lab in laby %}
      <a class="kafel" href="{{ lab.url }}">
        <h2>{{ lab.nazwa }}</h2>
        <p>{{ lab.opis }}</p>
      </a>
    {% endfor %}
  </div>
</body>
</html>
