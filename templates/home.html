{% load static %}
<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab0 | Bartosz Lauer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Space+Grotesk:wght@400;600&display=swap">
  <style>
    /* Te same kolory co w lab01 */
    :root {
      --bg: #faf7f2;
      --white: #ffffff;
      --text: #2a2222;
      --muted: #7a6b66;
      --line: #e8e0d6;
      --red: #b3001b;
      --red-light: #fbe9eb;
      --radius: 8px;
      --font: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
      --font-horror: "Creepster", Impact, cursive;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    /* Nagłówek z kroplami krwi */
    .site-header {
      position: relative;
      background: var(--red);
      text-align: center;
      padding: 24px 20px;
    }
    .site-header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      height: 34px;
      background: url("{% static 'lab01/img/drip.svg' %}") repeat-x;
      pointer-events: none;
    }
    .site-header h1 {
      margin: 0;
      font-family: var(--font-horror);
      font-weight: 400;
      font-size: 3.5rem;
      line-height: 1;
      color: var(--white);
    }
    .site-header p { margin: 6px 0 0; color: var(--white); opacity: .9; }

    /* Kafelki labów */
    main {
      flex: 1;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 80px 20px 56px;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
    }

    .kafel {
      flex: 0 1 240px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      padding: 24px;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      transition: transform .2s, box-shadow .2s, background .2s;
    }
    .kafel:hover {
      transform: translateY(-4px);
      background: var(--red-light);
      box-shadow: 0 8px 20px rgba(179, 0, 27, .15);
    }
    .kafel h2 { margin: 0; font-size: 1.8rem; color: var(--red); }
    .kafel p { margin: 0; color: var(--muted); }

    /* Stopka */
    footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .9rem;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .site-header h1 { font-size: 2.8rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1>Lab0</h1>
    <p>Programowanie internetowe · Django</p>
  </header>

  <main>
    <div class="grid">
      {% for lab in laby %}
        <a class="kafel" href="{{ lab.url }}">
          <h2>{{ lab.nazwa }}</h2>
          <p>{{ lab.opis }}</p>
        </a>
      {% endfor %}
    </div>
  </main>

  <footer>&copy; {% now "Y" %} Bartosz Lauer</footer>
</body>
</html>
